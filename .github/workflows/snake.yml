name: Generate snake animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: sayembillah-dev
          outputs: |
            dist/github-snake.svg?color_snake=%23CAFF3C&color_dots=%23E9F5E4,%23C8E8BE,%239CD68C,%2356B364,%232E7D32
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23CAFF3C&color_dots=%230E2012,%23163A1C,%231F5A26,%232E7D32,%2378FF9C
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
